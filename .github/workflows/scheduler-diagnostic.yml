name: Scheduler diagnostic (no scraping or email)
on:
  push:
    branches: [main]
    paths: [.github/workflows/scheduler-diagnostic.yml]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the event GitHub delivered
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: echo "GitHub delivered trigger type $EVENT_NAME. This diagnostic reads no property websites and sends no emails." >> "$GITHUB_STEP_SUMMARY"
