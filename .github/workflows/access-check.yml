name: Check Pararius hosting compatibility
on:
  push:
    branches: [main]
    paths: [.github/workflows/access-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -u probe_pararius.py
