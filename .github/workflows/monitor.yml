name: Apartment alerts
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - requirements.txt
      - .github/workflows/monitor.yml
  workflow_dispatch:
    inputs:
      mode:
        description: What should this run do?
        required: true
        type: choice
        default: preview
        options:
          - preview
          - test_email
          - live
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
concurrency:
  group: apartment-alerts
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .collector-cache.json
          key: details-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: details-${{ runner.os }}-
      - id: monitor
        env:
          RUN_MODE: ${{ github.event_name == 'push' && 'preview' || inputs.mode || 'scheduled' }}
          SEND_ALERTS: ${{ vars.SEND_ALERTS || 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python -u monitor.py
      - uses: actions/cache/save@v4
        if: always() && steps.monitor.outputs.cache_changed == 'true'
        with:
          path: .collector-cache.json
          key: details-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
