name: Repair scheduler registration (no scraping or email)
on:
  push:
    branches: [main]
    paths: [.github/workflows/schedule-repair.yml]
permissions:
  actions: write
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Re-register only the automatic checker
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method PUT "repos/$GH_REPO/actions/workflows/scheduled-checks.yml/disable"
          gh api --method PUT "repos/$GH_REPO/actions/workflows/scheduled-checks.yml/enable"
          gh api "repos/$GH_REPO/actions/workflows/scheduled-checks.yml" --jq '{id, state, path}'
