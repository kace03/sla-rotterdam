name: Verify timer command while paused
on:
  push:
    branches: [main]
    paths: [.github/workflows/schedule-repair.yml]
permissions:
  actions: write
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch the registered checker; its saved STOP switch remains in force
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/actions/workflows/scheduled-checks.yml/dispatches" -f ref=main
